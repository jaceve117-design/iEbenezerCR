<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Intro en partículas — Ministerios Ebenezer C.R</title>
<meta name="theme-color" content="#E8E5DF">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8E5DF; --fg:#100F0D; --fg-2:#5C594F; --line:rgba(16,15,13,.15);
  --serif:'EB Garamond', Garamond, Georgia, serif;
}
[data-theme="dark"]{ --bg:#08080A; --fg:#F0EEE9; --fg-2:#8E8B98; --line:rgba(240,238,233,.12); }
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--serif);font-size:18px;
  overflow:hidden;-webkit-font-smoothing:antialiased;transition:background-color .6s ease}

/* lo que hay detrás del intro, para ver el destape */
.sitio{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:24px}
.sitio h1{font-weight:500;font-size:clamp(34px,6vw,64px);letter-spacing:-.025em;line-height:1.05}
.sitio p{margin-top:14px;color:var(--fg-2);font-style:italic}
.sitio .marco{border:1px solid var(--line);border-radius:18px;padding:clamp(30px,6vw,60px);
  max-width:620px;width:100%}
.sitio .eti{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--fg-2);
  margin-bottom:18px}

#velo{position:fixed;inset:0;z-index:10;background:var(--bg);transition:background-color .6s ease}
#lienzo{position:fixed;inset:0;z-index:11;pointer-events:none}

.panel{position:fixed;left:50%;translate:-50% 0;bottom:22px;z-index:40;
  display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;
  background:color-mix(in oklab,var(--bg) 84%,transparent);
  border:1px solid var(--line);border-radius:14px;padding:9px 12px;backdrop-filter:blur(14px)}
.panel button{font-family:var(--serif);font-size:13px;letter-spacing:.12em;text-transform:uppercase;
  padding:9px 15px;border-radius:10px;border:1px solid var(--line);background:transparent;
  color:var(--fg);cursor:pointer;transition:background-color .3s,border-color .3s}
.panel button:hover{border-color:#A8690A;background:color-mix(in oklab,#A8690A 12%,transparent)}
.panel button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.panel span{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--fg-2);padding-inline:6px}
.panel b{font-family:var(--serif);font-weight:500;font-size:13px;letter-spacing:.06em;
  min-width:46px;text-align:right;font-variant-numeric:tabular-nums}
#dur{-webkit-appearance:none;appearance:none;width:132px;height:22px;background:transparent;cursor:pointer}
#dur::-webkit-slider-runnable-track{height:2px;background:var(--line);border-radius:2px}
#dur::-moz-range-track{height:2px;background:var(--line);border-radius:2px}
#dur::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;
  background:#A8690A;margin-top:-6.5px;border:0;transition:transform .25s}
#dur::-moz-range-thumb{width:15px;height:15px;border-radius:50%;background:#A8690A;border:0}
#dur:hover::-webkit-slider-thumb{transform:scale(1.25)}
.nota{position:fixed;left:50%;translate:-50% 0;top:18px;z-index:40;font-size:12px;
  letter-spacing:.16em;text-transform:uppercase;color:var(--fg-2);text-align:center;padding-inline:20px}
@media(max-width:520px){ .panel button{padding:8px 11px;font-size:11px} }
</style>
</head>
<body>

<div class="sitio">
  <div class="marco">
    <p class="eti">Aquí entra la web</p>
    <h1>Hasta aquí nos<br>ayudó Jehová</h1>
    <p>El intro se disuelve y aparece el carrusel de secciones.</p>
  </div>
</div>

<div id="velo"></div>
<canvas id="lienzo"></canvas>
<p class="nota">Preview del intro en partículas</p>

<div class="panel">
  <button id="repetir">Repetir</button>
  <span>Densidad</span>
  <button class="dens" data-p="4">Suave</button>
  <button class="dens" data-p="3">Media</button>
  <button class="dens on" data-p="2">Densa</button>
  <span>·</span>
  <span>Duración</span>
  <input type="range" id="dur" min="1" max="5" step="0.1" value="3" aria-label="Duración del intro">
  <b id="durVal">3.0 s</b>
  <span>·</span>
  <button id="tema">Tema</button>
</div>

<script>
const RUTA_LOGO = 'img/logo-hd.webp';   // 1080 px de ancho

const lienzo = document.getElementById('lienzo');
const ctx    = lienzo.getContext('2d', {alpha:true});
const velo   = document.getElementById('velo');
const raiz   = document.documentElement;

let DPR = Math.min(2, devicePixelRatio || 1);
let W = 0, H = 0;
let particulas = [];
let comp = null;              // lienzo con el logo + «Costa Rica», a resolución completa
let paso = 2;                 // muestreo: menor = más partículas
let t0 = 0, corriendo = false;
let pase = 0;                 // token: abandona los bucles de pases viejos

/* Guion proporcional: la duración total la manda el deslizador.
   El reparto se mantiene igual sea cual sea el total. */
const PROP = { entrada:0.40, reposo:0.275, salida:0.325 };
let duracion = 3000;          // ms — 3 s por defecto
let plan = null;              // tiempos fijados al arrancar cada pase

const suaveOut = t => 1 - Math.pow(1-t, 4);
const expoIn   = t => t <= 0 ? 0 : Math.pow(2, 10*(t-1));
const suave    = t => t*t*(3-2*t);

function medir(){
  DPR = Math.min(2, devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  lienzo.width = Math.round(W*DPR); lienzo.height = Math.round(H*DPR);
  lienzo.style.width = W+'px'; lienzo.style.height = H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}

/* ── La composición: el logo con «Costa Rica» abajo a la derecha ──
   Se dibuja a resolución de dispositivo (DPR) sobre el logo de 1080 px,
   para que el remate final salga nítido de verdad.                  */
function componer(img){
  medir();
  const lado = Math.min(W*0.64, H*0.46, 470);
  const esc  = lado/img.width;
  const aL   = Math.round(img.width*esc);
  const hL   = Math.round(img.height*esc);

  const c = document.createElement('canvas');
  c.width  = Math.round(aL*DPR);
  c.height = Math.round(hL*DPR);
  const g = c.getContext('2d', {willReadFrequently:true});
  g.setTransform(DPR,0,0,DPR,0,0);
  g.imageSmoothingQuality = 'high';
  g.drawImage(img, 0, 0, aL, hL);
  const total = hL;

  comp = { canvas:c, w:aL, h:total, ox:(W-aL)/2, oy:(H-total)/2 };
}

/* Muestrea la composición y convierte cada píxel visible en partícula */
function sembrar(){
  const g = comp.canvas.getContext('2d', {willReadFrequently:true});
  const anchoPx = comp.canvas.width;
  const datos = g.getImageData(0, 0, anchoPx, comp.canvas.height).data;
  const salto = Math.max(1, Math.round(paso*DPR));

  particulas = [];
  const radio = Math.hypot(W, H)*0.62;
  const lado = comp.w;

  for(let py=0; py<comp.canvas.height; py+=salto){
    for(let px=0; px<anchoPx; px+=salto){
      const i = (py*anchoPx + px)*4;
      if(datos[i+3] < 40) continue;

      const tx = comp.ox + px/DPR;
      const ty = comp.oy + py/DPR;
      const dx = tx - W/2, dy = ty - H/2;
      const dist = Math.hypot(dx, dy), ang = Math.atan2(dy, dx);

      const angE = ang + (Math.random()-0.5)*1.5;
      const radE = radio*(0.55 + Math.random()*0.75);
      const angS = ang + (Math.random()-0.5)*0.55;
      const radS = radio*(0.7 + Math.random()*0.6);

      particulas.push({
        tx, ty,
        ax: W/2 + Math.cos(angE)*radE, ay: H/2 + Math.sin(angE)*radE,
        bx: W/2 + Math.cos(angS)*radS, by: H/2 + Math.sin(angS)*radS,
        dEnt: Math.min(0.70, (dist/(lado*0.72))*0.52 + Math.random()*0.24),
        dSal: Math.random()*0.34,
        r: datos[i], g: datos[i+1], b: datos[i+2], a: datos[i+3]/255,
        s: paso <= 2 ? 1.5 : paso <= 3 ? 1.9 : 2.4
      });
    }
  }
}

function dibujar(ms){
  if(dibujar.pase !== pase) return;      // llegó tarde: este pase ya no vale
  const tEnt = plan.ent, tRep = plan.rep, tSal = plan.sal;
  const t = ms - t0;

  ctx.clearRect(0, 0, W, H);

  /* nitidez: 0 = sólo partículas · 1 = el logo entero, limpio.
     Sube en el último tramo de la entrada, así el intro REMATA con el
     logo completo y nítido en vez de quedarse en un puntillado. */
  let nitidez;
  if(t < tEnt){
    nitidez = suave(Math.max(0, Math.min(1, (t/tEnt - 0.74)/0.26)));
  }else if(t < tEnt + tRep){
    nitidez = 1;
  }else{
    nitidez = 1 - suave(Math.min(1, (t - tEnt - tRep)/(tSal*0.26)));
  }

  // el velo se retira durante la dispersión, destapando la web
  const pv = t < tEnt + tRep ? 0 : Math.min(1, (t - tEnt - tRep)/(tSal*0.85));
  velo.style.opacity = String(1 - suave(pv));

  if(nitidez < 0.999){
    for(let n=0; n<particulas.length; n++){
      const p = particulas[n];
      let x, y, alfa;
      if(t < tEnt){
        const u = Math.max(0, Math.min(1, (t/tEnt - p.dEnt)/(1 - p.dEnt)));
        const e = suaveOut(u);
        x = p.ax + (p.tx - p.ax)*e;
        y = p.ay + (p.ty - p.ay)*e;
        alfa = p.a * Math.min(1, u*2.4);
      }else if(t < tEnt + tRep){
        x = p.tx; y = p.ty; alfa = p.a;
      }else{
        const u = Math.max(0, Math.min(1, ((t - tEnt - tRep)/tSal - p.dSal)/(1 - p.dSal)));
        const e = expoIn(u);
        x = p.tx + (p.bx - p.tx)*e;
        y = p.ty + (p.by - p.ty)*e;
        alfa = p.a * (1 - suave(u));
      }
      alfa *= (1 - nitidez);
      if(alfa <= 0.01) continue;
      ctx.globalAlpha = alfa;
      ctx.fillStyle = `rgb(${p.r},${p.g},${p.b})`;
      ctx.fillRect(x, y, p.s, p.s);
    }
  }

  // el logo limpio, por encima
  if(nitidez > 0.001){
    ctx.globalAlpha = nitidez;
    ctx.drawImage(comp.canvas, comp.ox, comp.oy, comp.w, comp.h);
  }
  ctx.globalAlpha = 1;

  if(t < tEnt + tRep + tSal){
    requestAnimationFrame(dibujar);
  }else{
    ctx.clearRect(0, 0, W, H);
    velo.style.opacity = '0';
    velo.style.pointerEvents = 'none';
    corriendo = false;
  }
}

async function reproducir(){
  const mio = ++pase;                    // invalida cualquier pase anterior
  corriendo = true;
  velo.style.opacity = '1';
  velo.style.pointerEvents = '';
  // los tiempos se fijan al arrancar: mover el deslizador a media
  // reproducción no debe descolocar el pase en curso
  plan = { ent: duracion*PROP.entrada,
           rep: duracion*PROP.reposo,
           sal: duracion*PROP.salida };
  componer(imagen);
  sembrar();
  if(mio !== pase) return;               // nos adelantaron mientras componíamos
  t0 = performance.now();
  dibujar.pase = mio;
  requestAnimationFrame(dibujar);
}

const imagen = new Image();
imagen.decoding = 'async';
imagen.onload = () => reproducir();
imagen.src = RUTA_LOGO;

addEventListener('resize', () => { if(!corriendo){ medir(); ctx.clearRect(0,0,W,H); } });

document.getElementById('repetir').addEventListener('click', reproducir);
const barra = document.getElementById('dur');
const rotulo = document.getElementById('durVal');
barra.addEventListener('input', () => {
  duracion = Math.round(parseFloat(barra.value)*1000);
  rotulo.textContent = (duracion/1000).toFixed(1)+' s';
});
barra.addEventListener('change', reproducir);   // reinicia con la duración nueva
document.getElementById('tema').addEventListener('click', () => {
  raiz.dataset.theme = raiz.dataset.theme === 'dark' ? 'light' : 'dark';
  document.querySelector('meta[name=theme-color]').content =
    raiz.dataset.theme === 'dark' ? '#08080A' : '#E8E5DF';
});
document.querySelectorAll('.dens').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.dens').forEach(x => x.classList.remove('on'));
  b.classList.add('on');
  paso = +b.dataset.p;
  reproducir();
}));
</script>
</body>
</html>
