<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Intro en partículas — Ministerios Ebenezer C.R</title>
<meta name="theme-color" content="#E8E5DF">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8E5DF; --fg:#100F0D; --fg-2:#5C594F; --line:rgba(16,15,13,.15);
  --serif:'EB Garamond', Garamond, Georgia, serif;
}
[data-theme="dark"]{ --bg:#08080A; --fg:#F0EEE9; --fg-2:#8E8B98; --line:rgba(240,238,233,.12); }
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--serif);font-size:18px;
  overflow:hidden;-webkit-font-smoothing:antialiased;
  transition:background-color .6s ease}

/* lo que hay "detrás" del intro, para ver el destape */
.sitio{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:24px}
.sitio h1{font-weight:500;font-size:clamp(34px,6vw,64px);letter-spacing:-.025em;line-height:1.05}
.sitio p{margin-top:14px;color:var(--fg-2);font-style:italic}
.sitio .marco{border:1px solid var(--line);border-radius:18px;padding:clamp(30px,6vw,60px);
  max-width:620px;width:100%}
.sitio .eti{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--fg-2);
  margin-bottom:18px}

/* capa del intro */
#velo{position:fixed;inset:0;z-index:10;background:var(--bg);transition:background-color .6s ease}
#lienzo{position:fixed;inset:0;z-index:11;pointer-events:none}

/* controles de la demo */
.panel{position:fixed;left:50%;translate:-50% 0;bottom:22px;z-index:40;
  display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;
  background:color-mix(in oklab,var(--bg) 84%,transparent);
  border:1px solid var(--line);border-radius:14px;padding:9px 12px;
  backdrop-filter:blur(14px)}
.panel button{font-family:var(--serif);font-size:13px;letter-spacing:.12em;text-transform:uppercase;
  padding:9px 15px;border-radius:10px;border:1px solid var(--line);background:transparent;
  color:var(--fg);cursor:pointer;transition:background-color .3s,border-color .3s}
.panel button:hover{border-color:#A8690A;background:color-mix(in oklab,#A8690A 12%,transparent)}
.panel button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.panel span{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--fg-2);
  padding-inline:6px}
.nota{position:fixed;left:50%;translate:-50% 0;top:18px;z-index:40;font-size:12px;
  letter-spacing:.16em;text-transform:uppercase;color:var(--fg-2);text-align:center;
  padding-inline:20px}
@media(max-width:520px){ .panel button{padding:8px 11px;font-size:11px} }
</style>
</head>
<body>

<div class="sitio">
  <div class="marco">
    <p class="eti">Aquí entra la web</p>
    <h1>Hasta aquí nos<br>ayudó Jehová</h1>
    <p>El intro se disuelve y aparece el carrusel de secciones.</p>
  </div>
</div>

<div id="velo"></div>
<canvas id="lienzo"></canvas>

<p class="nota">Preview del intro en partículas</p>

<div class="panel">
  <button id="repetir">Repetir</button>
  <span>Densidad</span>
  <button class="dens" data-p="4">Suave</button>
  <button class="dens" data-p="3">Media</button>
  <button class="dens on" data-p="2">Densa</button>
  <span>·</span>
  <button id="tema">Tema</button>
  <button id="lento">Cámara lenta</button>
</div>

const lienzo = document.getElementById('lienzo');
const ctx = lienzo.getContext('2d', {alpha:true});
const velo = document.getElementById('velo');
const raiz = document.documentElement;

let DPR = Math.min(2, devicePixelRatio || 1);
let W = 0, H = 0;
let particulas = [];
let paso = 2;          // muestreo: menor = más partículas
let lento = false;
let t0 = 0, corriendo = false;

/* Tiempos del guion, en milisegundos */
const T = {
  entrada : 1500,      // las partículas convergen y forman el logo
  reposo  :  850,      // el logo se sostiene
  salida  : 1250       // se dispersan y destapan la web
};
const TOTAL = () => T.entrada + T.reposo + T.salida;

// quart-out en vez de expo-out: la formacion se reparte por toda la
// entrada en vez de resolverse en el primer tercio
const suaveOut = t => 1 - Math.pow(1-t, 4);
const expoIn   = t => t===0 ? 0 : Math.pow(2, 10*(t-1));
const suave    = t => t*t*(3-2*t);

function medir(){
  DPR = Math.min(2, devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  lienzo.width = W*DPR; lienzo.height = H*DPR;
  lienzo.style.width = W+'px'; lienzo.style.height = H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}

/* Muestrea el logo y convierte cada píxel visible en una partícula */
function construir(img){
  medir();
  const lado = Math.min(W*0.64, H*0.5, 470);
  const escala = lado / img.width;
  const anchoL = Math.round(img.width*escala);
  const altoL  = Math.round(img.height*escala);
  const ox = (W-anchoL)/2, oy = (H-altoL)/2;

  const aux = document.createElement('canvas');
  aux.width = anchoL; aux.height = altoL;
  const ac = aux.getContext('2d', {willReadFrequently:true});
  ac.drawImage(img, 0, 0, anchoL, altoL);
  const datos = ac.getImageData(0, 0, anchoL, altoL).data;

  particulas = [];
  const radioSalida = Math.hypot(W, H) * 0.62;

  for(let y=0; y<altoL; y+=paso){
    for(let x=0; x<anchoL; x+=paso){
      const i = (y*anchoL + x)*4;
      const a = datos[i+3];
      if(a < 40) continue;

      const dx = (x + ox) - W/2;
      const dy = (y + oy) - H/2;
      const distCentro = Math.hypot(dx, dy);
      const angulo = Math.atan2(dy, dx);

      // nace lejos, sobre la misma dirección radial, con dispersión angular
      const angEnt = angulo + (Math.random()-0.5) * 1.5;
      const radEnt = radioSalida * (0.55 + Math.random()*0.75);
      // se marcha hacia fuera, abriéndose
      const angSal = angulo + (Math.random()-0.5) * 0.55;
      const radSal = radioSalida * (0.7 + Math.random()*0.6);

      particulas.push({
        // destino: su sitio dentro del logo
        tx: x + ox,
        ty: y + oy,
        // origen y fuga
        ax: W/2 + Math.cos(angEnt)*radEnt,
        ay: H/2 + Math.sin(angEnt)*radEnt,
        bx: W/2 + Math.cos(angSal)*radSal,
        by: H/2 + Math.sin(angSal)*radSal,
        // el retardo escalona la formación de dentro hacia fuera
        dEnt: Math.min(0.70, (distCentro/(lado*0.72))*0.52 + Math.random()*0.24),
        dSal: Math.random()*0.34,
        r: datos[i], g: datos[i+1], b: datos[i+2], a: a/255,
        s: paso <= 2 ? 1.5 : paso <= 3 ? 1.9 : 2.4
      });
    }
  }
}

function dibujar(ms){
  const total = TOTAL() * (lento ? 2.6 : 1);
  const tEnt = T.entrada * (lento ? 2.6 : 1);
  const tRep = T.reposo  * (lento ? 2.6 : 1);
  const tSal = T.salida  * (lento ? 2.6 : 1);

  const t = ms - t0;
  ctx.clearRect(0, 0, W, H);

  // el velo se retira durante la dispersión, destapando la web
  const pv = t < tEnt + tRep ? 0 : Math.min(1, (t - tEnt - tRep) / (tSal*0.8));
  velo.style.opacity = String(1 - suave(pv));

  for(let k=0; k<particulas.length; k++){
    const p = particulas[k];
    let x, y, alfa;

    if(t < tEnt){
      // ── fade-in: converge desde fuera hacia su sitio ──
      const u = Math.max(0, Math.min(1, (t/tEnt - p.dEnt) / (1 - p.dEnt)));
      const e = suaveOut(u);
      x = p.ax + (p.tx - p.ax)*e;
      y = p.ay + (p.ty - p.ay)*e;
      alfa = p.a * Math.min(1, u*2.4);
    } else if(t < tEnt + tRep){
      // ── reposo: el logo entero, quieto ──
      x = p.tx; y = p.ty; alfa = p.a;
    } else {
      // ── fade-out: se abren y se van ──
      const u = Math.max(0, Math.min(1, ((t - tEnt - tRep)/tSal - p.dSal) / (1 - p.dSal)));
      const e = expoIn(u);
      x = p.tx + (p.bx - p.tx)*e;
      y = p.ty + (p.by - p.ty)*e;
      alfa = p.a * (1 - suave(u));
    }

    if(alfa <= 0.01) continue;
    ctx.globalAlpha = alfa;
    ctx.fillStyle = `rgb(${p.r},${p.g},${p.b})`;
    ctx.fillRect(x, y, p.s, p.s);
  }
  ctx.globalAlpha = 1;

  if(t < total){
    requestAnimationFrame(dibujar);
  } else {
    ctx.clearRect(0,0,W,H);
    velo.style.opacity = '0';
    velo.style.pointerEvents = 'none';
    corriendo = false;
  }
}

function reproducir(){
  if(corriendo) return;
  corriendo = true;
  velo.style.opacity = '1';
  construir(imagen);
  t0 = performance.now();
  requestAnimationFrame(dibujar);
}

const imagen = new Image();
imagen.onload = () => { construir(imagen); reproducir(); };
imagen.src = LOGO;

addEventListener('resize', () => { if(!corriendo){ medir(); ctx.clearRect(0,0,W,H); } });

document.getElementById('repetir').addEventListener('click', reproducir);
document.getElementById('lento').addEventListener('click', e => {
  lento = !lento; e.currentTarget.classList.toggle('on', lento);
});
document.getElementById('tema').addEventListener('click', () => {
  raiz.dataset.theme = raiz.dataset.theme === 'dark' ? 'light' : 'dark';
  document.querySelector('meta[name=theme-color]').content =
    raiz.dataset.theme === 'dark' ? '#08080A' : '#E8E5DF';
});
document.querySelectorAll('.dens').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.dens').forEach(x => x.classList.remove('on'));
  b.classList.add('on');
  paso = +b.dataset.p;
  if(!corriendo) reproducir();
}));
</script>
</body>
