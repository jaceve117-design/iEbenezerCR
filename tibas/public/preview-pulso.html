<!DOCTYPE html>
<html lang="es" data-tema="claro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Preview · temas, colores y pulso — Ebenezer CR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EAE9E6; --bg-2:#E1E0DC; --panel:#F6F5F2; --fg:#131210; --fg-2:#5E5B53;
  --line:rgba(19,18,16,.15); --gold:#9C7318; --glow:rgba(156,115,24,.22);
  --nav-h:72px; --dock-h:158px;
}
[data-tema="oscuro"]{
  --bg:#08080A; --bg-2:#0D0D11; --panel:#121218; --fg:#F0EEE9; --fg-2:#8E8B98;
  --line:rgba(240,238,233,.10); --gold:#D5B269; --glow:rgba(213,178,105,.25);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--fg);font-family:'EB Garamond',Georgia,serif;overflow:hidden;
  transition:background-color .2s ease,color .2s ease}

/* ── mini header: logo + icono de tema (el pulso sale de aquí) ── */
.cab{position:fixed;top:0;left:0;right:0;height:var(--nav-h);z-index:30;
  display:flex;align-items:center;justify-content:space-between;padding:0 clamp(14px,3vw,28px)}
.cab img{height:54px;width:auto}
.modo{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--panel);
  color:var(--fg);display:grid;place-items:center;cursor:pointer;font-size:17px;
  transition:border-color .3s,background-color .3s}
.modo:hover{border-color:var(--gold)}
.modo svg{width:17px;height:17px}

/* ── tarjetas flotantes (misma física que la web) ── */
.escena{position:fixed;inset:0;z-index:1;overflow:hidden;touch-action:none;cursor:grab}
.escena:active{cursor:grabbing}
.deck{position:absolute;left:0;width:100%;height:0;
  perspective:1200px;transform-style:preserve-3d}
.tarjeta{position:absolute;top:0;left:0;width:var(--cw,32vw);transform-style:preserve-3d;cursor:pointer}
.tarjeta figure{position:relative;width:100%;height:var(--ch,58vh);overflow:hidden;background:var(--bg-2);
  box-shadow:0 0 0 1px var(--line),0 24px 60px -30px rgba(0,0,0,.5)}
.tarjeta img{width:100%;height:100%;object-fit:cover;display:block;
  filter:grayscale(var(--g,1)) contrast(1.02);transform:scale(1.02);transition:transform 1.1s var(--e, cubic-bezier(.16,1,.3,1))}
.tarjeta:hover img{transform:scale(1.06);filter:grayscale(calc(var(--g,1)*.18)) contrast(1.04)}
.tarjeta figcaption{position:relative;display:flex;align-items:baseline;gap:12px;padding-top:13px;
  font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--fg-2)}
.tarjeta figcaption .nm{font-weight:500;font-size:clamp(18px,1.8vw,25px);letter-spacing:.055em;color:var(--fg)}
.tarjeta figcaption .ir{margin-left:auto;color:var(--gold);opacity:.9}
.tarjeta figcaption::before{content:"";position:absolute;left:0;bottom:-5px;height:1px;width:0;
  background:var(--gold);transition:width .7s cubic-bezier(.16,1,.3,1)}
.tarjeta.act figcaption::before{width:100%}
.deck.mov .tarjeta{will-change:transform,opacity}

/* ── controles abajo ── */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:color-mix(in srgb,var(--panel) 88%,transparent);backdrop-filter:blur(10px);
  border-top:1px solid var(--line);padding:10px clamp(12px,3vw,26px) 12px;
  display:flex;flex-direction:column;gap:8px}
.grupo{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.k{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--fg-2);width:74px;flex:none}
.fila{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button.vel{font:inherit;color:var(--fg);background:transparent;border:1px solid var(--line);
  border-radius:100px;padding:6px 15px;font-size:13.5px;letter-spacing:.05em;cursor:pointer;
  transition:border-color .25s,color .25s}
button.vel.on{border-color:var(--gold);color:var(--gold)}
button.muestra{width:74px;height:30px;border-radius:9px;border:1px solid var(--line);cursor:pointer;
  position:relative;overflow:hidden;transition:border-color .25s,transform .25s}
button.muestra:hover{transform:translateY(-1px)}
button.muestra.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
button.muestra i{position:absolute;left:0;right:0;bottom:0;height:5px;display:block}
.nombre{font-size:12.5px;font-style:italic;color:var(--fg-2);min-width:110px}
@media(max-width:560px){.k{width:100%}.nombre{display:none}:root{--dock-h:196px}}
</style>
</head>
<body>
<header class="cab">
  <img src="img/logo-hd.webp" alt="Ebenezer CR">
  <button class="modo" id="modo" aria-label="Cambiar tema">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" id="icoLuna">
      <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  </button>
</header>

<main class="escena" id="escena"><div class="deck" id="deck"></div></main>

<footer class="dock">
  <div class="grupo"><span class="k">Velocidad</span>
    <div class="fila" id="filaVel">
      <button class="vel" data-ms="300">300 ms</button>
      <button class="vel on" data-ms="400">400 ms</button>
      <button class="vel" data-ms="500">500 ms</button>
      <button class="vel" data-ms="650">650 ms</button>
    </div>
  </div>
  <div class="grupo"><span class="k">Tema claro</span>
    <div class="fila" id="filaClaro"></div><span class="nombre" id="nomClaro"></span>
  </div>
  <div class="grupo"><span class="k">Tema oscuro</span>
    <div class="fila" id="filaOscuro"></div><span class="nombre" id="nomOscuro"></span>
  </div>
</footer>

<script>
/* ── paletas candidatas ─────────────────────────────────────────── */
const CLAROS=[
 {n:'Gris elegante', bg:'#EAE9E6', bg2:'#E1E0DC', panel:'#F6F5F2', fg:'#131210', fg2:'#5E5B53', line:'rgba(19,18,16,.15)',  gold:'#9C7318'},
 {n:'Marfil',        bg:'#F4F1EA', bg2:'#EAE6DC', panel:'#FBF9F4', fg:'#16130D', fg2:'#635D50', line:'rgba(22,19,13,.16)',  gold:'#A67B1E'},
 {n:'Gris frío',     bg:'#ECEDEE', bg2:'#E2E4E6', panel:'#F7F8F9', fg:'#111318', fg2:'#565B63', line:'rgba(17,19,24,.15)',  gold:'#8F6E14'},
 {n:'Crema',         bg:'#F2EDE1', bg2:'#E9E2D2', panel:'#F8F4EA', fg:'#171208', fg2:'#655B44', line:'rgba(23,18,8,.16)',   gold:'#96700F'},
 {n:'Piedra',        bg:'#E2E0DB', bg2:'#D7D5CF', panel:'#ECEAE5', fg:'#141311', fg2:'#5A574F', line:'rgba(20,19,17,.18)',  gold:'#8C6D14'}];
const OSCUROS=[
 {n:'Azabache',      bg:'#08080A', bg2:'#0D0D11', panel:'#121218', fg:'#F0EEE9', fg2:'#8E8B98', line:'rgba(240,238,233,.10)', gold:'#D5B269'},
 {n:'Azul noche',    bg:'#0A0E17', bg2:'#0E1420', panel:'#131A28', fg:'#EDEFF4', fg2:'#8B93A5', line:'rgba(237,239,244,.10)', gold:'#D9B96E'},
 {n:'Carbón cálido', bg:'#12100D', bg2:'#181512', panel:'#1D1A16', fg:'#F2EDE5', fg2:'#948D81', line:'rgba(242,237,229,.10)', gold:'#D8AF62'},
 {n:'Vino',          bg:'#120C0F', bg2:'#181114', panel:'#1E1518', fg:'#F2E9EC', fg2:'#9A8A90', line:'rgba(242,233,236,.10)', gold:'#DBB46E'},
 {n:'Bosque',        bg:'#0A100D', bg2:'#0F1713', panel:'#141E19', fg:'#EAF0EC', fg2:'#8A968F', line:'rgba(234,240,236,.10)', gold:'#CDB371'}];

const SECCIONES=[
 ['img/servicios.webp','Servicios','01'],['img/historia.webp','Historia','02'],
 ['img/departamentos.webp','Departamentos','03'],['img/envivo.webp','En Vivo','04'],
 ['img/recursos.webp','Recursos','05'],['img/visitanos.webp','Visítanos','06']];

let dur=400, iClaro=0, iOscuro=0, oscuro=false;
const root=document.documentElement, $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];

function aplicarPaleta(p){
  const r=root.style;
  r.setProperty('--bg',p.bg); r.setProperty('--bg-2',p.bg2); r.setProperty('--panel',p.panel);
  r.setProperty('--fg',p.fg); r.setProperty('--fg-2',p.fg2);
  r.setProperty('--line',p.line); r.setProperty('--gold',p.gold);
  r.setProperty('--glow',p.gold+'44');
}
function temaActual(){ return oscuro ? OSCUROS[iOscuro] : CLAROS[iClaro]; }
function refrescar(){ aplicarPaleta(temaActual());
  $('#nomClaro').textContent=CLAROS[iClaro].n; $('#nomOscuro').textContent=OSCUROS[iOscuro].n;
  $$('#filaClaro .muestra').forEach((b,i)=>b.classList.toggle('on',i===iClaro));
  $$('#filaOscuro .muestra').forEach((b,i)=>b.classList.toggle('on',i===iOscuro)); }

/* ── controles ── */
$$('#filaVel .vel').forEach(b=>b.addEventListener('click',()=>{
  $$('#filaVel .vel').forEach(x=>x.classList.toggle('on',x===b)); dur=+b.dataset.ms; }));
CLAROS.forEach((p,i)=>{
  const b=document.createElement('button'); b.className='muestra'; b.title=p.n;
  b.style.background=p.bg; b.innerHTML=`<i style="background:${p.gold}"></i>`;
  b.addEventListener('click',()=>{ iClaro=i; refrescar(); }); $('#filaClaro').append(b); });
OSCUROS.forEach((p,i)=>{
  const b=document.createElement('button'); b.className='muestra'; b.title=p.n;
  b.style.background=p.bg; b.innerHTML=`<i style="background:${p.gold}"></i>`;
  b.addEventListener('click',()=>{ iOscuro=i; refrescar(); }); $('#filaOscuro').append(b); });
refrescar();

/* ── el pulso (idéntico al de la web, velocidad variable) ── */
function pulso(x,y,ms){
  const destino=(oscuro?CLAROS[iClaro]:OSCUROS[iOscuro]).bg;
  const disco=document.createElement('div');
  disco.className='onda';
  disco.style.cssText=`position:fixed;width:24px;height:24px;border-radius:50%;z-index:9995;pointer-events:none;`+
    `transform:translate(-50%,-50%) scale(0);left:${x}px;top:${y}px;background:${destino};`+
    `transition:transform ${ms}ms cubic-bezier(.6,.2,.35,1),opacity ${Math.round(ms*.45)}ms ease-out ${Math.round(ms*.8)}ms`;
  const anillo=document.createElement('div');
  anillo.className='anillo';
  anillo.style.cssText=`position:fixed;width:24px;height:24px;border-radius:50%;z-index:9994;pointer-events:none;`+
    `border:1px solid var(--gold);opacity:.8;transform:translate(-50%,-50%) scale(0);left:${x}px;top:${y}px;`+
    `transition:transform ${Math.round(ms*1.25)}ms cubic-bezier(.6,.2,.35,1) ${Math.round(ms*.12)}ms,opacity ${Math.round(ms*.55)}ms ease-out ${Math.round(ms*.65)}ms`;
  document.body.append(disco,anillo);
  requestAnimationFrame(()=>{
    const R=Math.hypot(Math.max(x,innerWidth-x),Math.max(y,innerHeight-y));
    disco.style.transform=`translate(-50%,-50%) scale(${R/12})`;
    anillo.style.transform=`translate(-50%,-50%) scale(${R/12})`;
    anillo.style.opacity='0'; disco.style.opacity='0';
  });
  setTimeout(()=>{ oscuro=!oscuro; root.dataset.tema=oscuro?'oscuro':'claro'; refrescar(); }, ms*.5);
  setTimeout(()=>{disco.remove();anillo.remove()}, ms*2.2);
}
function dispararPulso(ms){
  const r=$('#modo').getBoundingClientRect();
  pulso(r.left+r.width/2, r.top+r.height/2, ms||dur);
}
$('#modo').addEventListener('pointerdown',e=>{
  const r=e.currentTarget.getBoundingClientRect();
  pulso(r.left+r.width/2, r.top+r.height/2, dur);
});

/* ── carrusel flotante, misma física que la web ── */
const deck=$('#deck'), escena=$('#escena');
deck.innerHTML=SECCIONES.map(([img,n,num])=>`
  <figure class="tarjeta"><figure><img src="${img}" alt=""></figure>
    <figcaption><span>${num}</span><span class="nm">${n}</span>
    <span class="ir"><svg width="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></figcaption>
  </figure>`).join('');
const tarjetas=$$('.tarjeta');
let VW,CW,STEP,TOTAL,half;
function medida(){ VW=innerWidth; const por=VW<900?1.9:3;
  STEP=VW/por; CW=STEP-Math.max(14,VW*.014); TOTAL=NC*STEP; half=VW/2-CW/2;
  const cab=72, dock=document.querySelector('.dock').offsetHeight;
  const zona=Math.max(220, innerHeight-cab-dock-40);
  const ch=Math.min(zona-14, innerHeight*.52, CW*1.4);
  deck.style.setProperty('--cw',CW+'px');
  deck.style.setProperty('--ch',ch+'px');
  deck.style.top=(cab+16+(zona-ch)/2)+'px'; }
const NC=SECCIONES.length, Z=[-560,-90,170];
let pos=0,target=0,momentum=0,dragging=false,vivo=false,tPrev=0;
const cacheT=new Array(NC),cacheG=new Array(NC);
function cuadro(){
  const ahora=performance.now(), dt=tPrev?Math.min(64,ahora-tPrev):16.7; tPrev=ahora;
  const paso=dt/16.7;
  if(!dragging&&Math.abs(momentum)>.03){ target+=momentum*paso; momentum*=Math.pow(.945,paso); }
  pos+=(target-pos)*(1-Math.pow(.075,paso));
  const vel=Math.abs((target-pos)/paso);
  const zPush=vel*1.2;
  let minOff=1e9; const X=[],Zz=[];
  for(let i=0;i<NC;i++){ let d=((i*STEP-pos)%TOTAL+TOTAL)%TOTAL; if(d>TOTAL-STEP*2.5)d-=TOTAL;
    const x=half+d, z=Z[i%3]+zPush, esc=1200/(1200-z), off=Math.abs((x+CW/2)-VW/2)*esc;
    X[i]=x; Zz[i]=z; if(off<minOff)minOff=off; }
  tarjetas.forEach((c,i)=>{
    const g=Math.round(Math.abs((X[i]+CW/2)-VW/2)/(STEP*.55)*12)/12;
    if(cacheG[i]!==g){cacheG[i]=g;c.style.setProperty('--g',g.toFixed(3));}
    c.classList.toggle('act', Math.abs(X[i]+CW/2-VW/2)<STEP*.4);
    const t=`translate3d(${X[i].toFixed(2)}px,-50%,${Zz[i].toFixed(1)}px)`;
    if(cacheT[i]!==t){cacheT[i]=t;c.style.transform=t;}
    c.style.zIndex=String(100+Math.round(Zz[i]/8));
  });
  const activo=dragging||Math.abs(momentum)>.03||Math.abs(target-pos)>.1;
  if(activo)requestAnimationFrame(cuadro); else{vivo=false;tPrev=0;deck.classList.remove('mov');}
}
function despertar(){ if(vivo)return; vivo=true; deck.classList.add('mov'); cuadro(); }
medida(); despertar();
addEventListener('resize',()=>{medida();despertar();});
let id=null,x0=0,lastX=0,lastT=0,pv=0,anclado=0;
escena.addEventListener('pointerdown',e=>{ if(e.target.closest('.cab,.dock'))return;
  despertar(); id=e.pointerId; x0=lastX=e.clientX; anclado=target; pv=0; dragging=true;
  lastT=performance.now(); momentum=0; });
escena.addEventListener('pointermove',e=>{ if(id===null||e.pointerId!==id)return;
  pv=(lastX-e.clientX)/Math.max(8,performance.now()-lastT); lastX=e.clientX; lastT=performance.now();
  target=anclado-(e.clientX-x0)*1.12; });
escena.addEventListener('pointerup',e=>{ if(id===null)return; id=null; dragging=false;
  if(performance.now()-lastT<110) momentum=Math.max(-120,Math.min(120,pv*1.12*16.7)); });
escena.addEventListener('pointercancel',()=>{id=null;dragging=false;});

/* ── para la grabación ── */
window.__config=o=>{ if(o.vel){dur=o.vel;$$('#filaVel .vel').forEach(x=>x.classList.toggle('on',+x.dataset.ms===o.vel));}
  if(o.oscuro!==undefined){iOscuro=o.oscuro;} if(o.claro!==undefined){iClaro=o.claro;} refrescar(); };
window.__fijar=t=>{oscuro=t==='oscuro';root.dataset.tema=t;refrescar();};
window.pulsoIcono=(ms)=>dispararPulso(ms);
const auto=new URLSearchParams(location.search).get('auto');
if(auto){ dur=+auto; $$('#filaVel .vel').forEach(x=>x.classList.toggle('on',+x.dataset.ms===dur));
  setInterval(()=>dispararPulso(dur),1800); }
</script>
</body>
</html>
